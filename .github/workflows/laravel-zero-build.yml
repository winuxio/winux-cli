name: Winux CLI Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: [ '8.3', '8.4', '8.5' ]

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          extensions: mbstring, xml, ctype, json, openssl
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run tests
        run: composer test

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: mbstring, xml, ctype, json, openssl
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-dev

      - name: Build PHAR
        run: php winux app:build --build-version=dev-${GITHUB_SHA::7}

      - uses: actions/upload-artifact@v4
        with:
          name: winux-build
          path: builds/winux
