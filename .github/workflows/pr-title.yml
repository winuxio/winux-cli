name: PR Title

# release-please builds the changelog and version bump from commit messages on main.
# PRs are squash-merged, so the PR title becomes that commit: it must be a conventional commit,
# e.g. "feat: add site:php", "fix(import): keep APP_NAME", "feat!: drop PHP 8.2".

on:
  pull_request_target:
    types: [ opened, edited, synchronize, reopened ]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
