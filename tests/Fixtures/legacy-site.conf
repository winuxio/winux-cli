server {
	listen 80;
	listen [::]:80;

	server_name legacy-app.local.winux.io;
	return 302 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 127.0.0.1:9444 ssl;

	ssl_certificate {{BASE}}/ssl/certs/legacy-app.local.winux.io/legacy-app.local.winux.io.crt;
	ssl_certificate_key {{BASE}}/ssl/certs/legacy-app.local.winux.io/legacy-app.local.winux.io.key;

	server_name legacy-app.local.winux.io;

	root {{PROJECT}}/public;

    index index.php index.html index.htm;

    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.4-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
